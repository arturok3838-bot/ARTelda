
name: Build ARTelda APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ARTelda-source-code.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir extracted
          unzip -q ARTelda-source-code.zip -d extracted

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile
        run: gradle -p extracted/ARTelda assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTelda-debug-apk
          path: extracted/ARTelda/app/build/outputs/apk/debug/app-debug.apk
